  </g>

  <g transform="translate(139 710)">
    <path d="M0 46H338" class="fine" stroke-width="2"/>
    <text class="label muted" x="0" y="0" font-size="22">.NET MAUI</text>
    <text class="label muted" x="135" y="0" font-size="22">local storage</text>
    <text class="label muted" x="296" y="0" font-size="22">custom screens</text>
  </g>
