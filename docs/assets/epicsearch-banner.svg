      <path d="M53 33V25C53 10 77 10 77 25V33" stroke="#FBBF24" stroke-width="8" stroke-linecap="round"/>
      <rect x="42" y="32" width="46" height="34" rx="8" fill="#FBBF24"/>
      <text x="108" y="49" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="750" fill="#F8FAFC">CODE 4827</text>
    </g>
