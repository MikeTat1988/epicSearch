    </g>
    <g transform="translate(4 272)">
      <rect class="panel" x="0" y="0" width="360" height="62" rx="12"/>
      <circle cx="36" cy="31" r="12" fill="#34D399"/>
      <text class="label" x="64" y="39" font-size="25" font-weight="600">Preserve progress</text>
    </g>
