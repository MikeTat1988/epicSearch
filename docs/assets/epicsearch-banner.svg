<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ePicSearch project banner</title>
  <desc id="desc">A professional banner showing an Android app, photo clues, unlock codes, local progress, and a treasure-hunt path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="0.55" stop-color="#16314A"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="screen" x1="620" y1="155" x2="1020" y2="755" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#DDE7F0"/>
    </linearGradient>
    <linearGradient id="photoA" x1="684" y1="262" x2="936" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#99F6E4"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="photoB" x1="719" y1="459" x2="901" y2="586" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <style>
      .label { font-family: "Segoe UI", Arial, sans-serif; fill: #E5E7EB; }
      .muted { fill: #A7B5C7; }
      .panel { fill: #0F172A; fill-opacity: 0.54; stroke: #94A3B8; stroke-opacity: 0.34; }
      .fine { stroke: #E2E8F0; stroke-opacity: 0.36; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M120 742C280 590 450 622 612 525C828 395 907 208 1158 220C1312 228 1430 304 1504 418" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.22" stroke-dasharray="14 18"/>
  <path d="M136 654C337 470 523 513 675 388C812 275 986 131 1268 166" stroke="#FBBF24" stroke-width="2" stroke-opacity="0.16" stroke-dasharray="10 22"/>

