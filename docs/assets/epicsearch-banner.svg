    <text x="203" y="209" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800" fill="#0F172A">2</text>
    <path d="M132 321L140 331L156 309" stroke="#0F172A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(208 294)">
