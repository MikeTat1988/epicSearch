  </g>

  <g transform="translate(1160 656)">
    <rect x="0" y="0" width="288" height="92" rx="26" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/>
    <g transform="translate(35 23)" fill="#16A34A">
      <rect x="14" y="13" width="48" height="40" rx="12"/>
      <rect x="8" y="25" width="9" height="25" rx="4"/>
      <rect x="59" y="25" width="9" height="25" rx="4"/>
      <rect x="22" y="52" width="9" height="16" rx="4"/>
      <rect x="45" y="52" width="9" height="16" rx="4"/>
      <path d="M22 13L12 0" stroke="#16A34A" stroke-width="5" stroke-linecap="round"/>
      <path d="M54 13L64 0" stroke="#16A34A" stroke-width="5" stroke-linecap="round"/>
